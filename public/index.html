<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">ISW055 · Sistemas Inteligentes</p>
        <h1>Cadastro de Clientes</h1>
        <p class="subtitle">Projeto Integrador · Introdução à Computação em Nuvem</p>
      </div>
      <div id="status" class="status">Verificando MySQL...</div>
    </header>

    <section class="card form-card">
      <h2>Novo cadastro</h2>
      <form id="clienteForm">
        <label>
          Nome
          <input id="nome" name="nome" type="text" placeholder="Digite o nome" required>
        </label>

        <label>
          Telefone
          <input id="telefone" name="telefone" type="tel" placeholder="Digite o telefone" required>
        </label>

        <label>
          Valor
          <input id="valor" name="valor" type="number" min="0" step="0.01" placeholder="0,00" value="0">
        </label>

        <button type="submit">Cadastrar</button>
        <p id="mensagem" class="mensagem"></p>
      </form>
    </section>

    <section class="card">
      <div class="table-header">
        <div>
          <h2>Cadastros</h2>
          <p id="total">Total de registros: 0</p>
        </div>
        <button id="atualizar" class="secondary">Atualizar</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Nome</th>
              <th>Telefone</th>
              <th>Valor</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="lista">
            <tr><td colspan="5" class="empty">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer>
      <span>MySQL · Docker · Node.js</span>
      <span>Ambiente de estudo</span>
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
